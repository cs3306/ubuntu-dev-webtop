name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_ide:
        description: '重新下载 IDE / Go / Node 等 latest(默认复用缓存,版本不变)'
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 镜像 10GB+,先腾出 runner 磁盘
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            JB_REFRESH=${{ inputs.refresh_ide && github.run_id || vars.JB_REFRESH || '1' }}
            JB_IDEA_VERSION=${{ vars.JB_IDEA_VERSION || 'latest' }}
            JB_GOLAND_VERSION=${{ vars.JB_GOLAND_VERSION || 'latest' }}
            JB_PYCHARM_VERSION=${{ vars.JB_PYCHARM_VERSION || 'latest' }}
            JB_RUSTROVER_VERSION=${{ vars.JB_RUSTROVER_VERSION || 'latest' }}
            JB_CLION_VERSION=${{ vars.JB_CLION_VERSION || 'latest' }}
            WEB_PASSWORD=${{ secrets.WEB_PASSWORD || 'changeme' }}
            SSH_PUBLIC_KEY=${{ vars.SSH_PUBLIC_KEY }}
            WITH_OFFICE=${{ vars.WITH_OFFICE || '1' }}
            TEXLIVE_PKG=${{ vars.TEXLIVE_PKG != '' && vars.TEXLIVE_PKG || 'texlive-full latexmk biber chktex xindy texstudio' }}
            APT_EXTRA=${{ vars.APT_EXTRA }}
            PIP_EXTRA=${{ vars.PIP_EXTRA }}
            JB_PLUGINS_EXTRA=${{ vars.JB_PLUGINS_EXTRA }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-dev-webtop:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-dev-webtop:buildcache,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-dev-webtop:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-dev-webtop:r${{ github.run_number }}
