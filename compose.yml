# 示例 compose,按需修改。配置都在 .env(参考 .env.example)。
name: ubuntu-dev

services:
  dev:
    image: ${IMAGE:-ubuntu-dev-webtop:latest}
    build: .
    container_name: ubuntu-dev
    hostname: ubuntu-dev
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    env_file:
      - path: .env
        required: false
    ports:
      - "${HTTPS_PORT:-3101}:3001"
      - "${SSH_PORT:-2200}:22"
    volumes:
      - dev-config:/config
      - ssh-hostkeys:/etc/ssh/hostkeys
      - ${DEV_DIR:-./workspace}:/workspace
      # - /var/run/docker.sock:/var/run/docker.sock   # 容器内等同宿主 root,慎用
    # networks: [shared]      # 需要加入已有网络时取消注释,并取消底部 networks 的注释

volumes:
  dev-config:
  ssh-hostkeys:

